# Install the accompanying snippets and http-context cache maps first.
# Use the provisioned certificate paths for the v2 hostname.
server {
    listen 80;
    listen [::]:80;
    server_name v2.xn--pssy23gqgbz2d718b.com;
    return 308 https://v2.xn--pssy23gqgbz2d718b.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name v2.xn--pssy23gqgbz2d718b.com;

    ssl_certificate /etc/letsencrypt/live/v2.xn--pssy23gqgbz2d718b.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2.xn--pssy23gqgbz2d718b.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/dafeiyu-v2-proxy.inc;
}
