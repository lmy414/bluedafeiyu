# Load once in the nginx http context, for example in /etc/nginx/conf.d/.
map "$request_method:$status:$upstream_http_set_cookie" $dafeiyu_v2_web_cache {
    default                          "no-store";
    ~^(GET|HEAD):(200|304):$          "public, max-age=60, s-maxage=300, stale-while-revalidate=600";
}

map "$request_method:$status:$upstream_http_set_cookie" $dafeiyu_v2_open_api_cache {
    default                          "no-store";
    ~^(GET|HEAD):(200|304):$          "public, max-age=60, s-maxage=180";
}
