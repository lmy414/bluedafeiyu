# Enable only after the staging rollout, incremental import and origin checks.
# Replace the old apex vhost entry and keep its configuration for rollback.
map $arg_v $versioned_asset_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name xn--pssy23gqgbz2d718b.com www.xn--pssy23gqgbz2d718b.com;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/www/dafeiyu/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://xn--pssy23gqgbz2d718b.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.xn--pssy23gqgbz2d718b.com;

    ssl_certificate /etc/letsencrypt/live/xn--pssy23gqgbz2d718b.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--pssy23gqgbz2d718b.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://xn--pssy23gqgbz2d718b.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--pssy23gqgbz2d718b.com;

    ssl_certificate /etc/letsencrypt/live/xn--pssy23gqgbz2d718b.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--pssy23gqgbz2d718b.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/www/dafeiyu/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/dafeiyu-v2-proxy.inc;
}
