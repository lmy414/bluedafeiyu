# ops/nginx-legacy-image-redirects.conf —— 旧图片地址的精确 301 对照表
#
# 证据：.build/production-release/legacy-image-404s.json（生产 nginx 8 份访问日志的 404 汇总）。
# 只收录能用 data/works.json、data/blue-fish-classification.json、data/blue-fish-ids.json
# 的唯一文件名、SHA 前缀或稳定作品 ID 交叉证明，且目标文件在当前 release 中存在的映射。
# 每条都是精确 location，不写正则、不接管其它 404，也不改变正常页面和图片。
#
# 接入：在站点 HTTPS server{} 内增加下面一行（本文件需要随源码一起部署到 server 上）：
#   include /srv/www/dafeiyu/source/ops/nginx-legacy-image-redirects.conf;
# 生效/回滚见 docs/后台运维.md「旧图片 301」。

