# ops/nginx-performance.conf —— 站点性能相关的 nginx 配置片段
#
# 当前生产 vhost 已经维护 gzip、gzip_types 与缓存分层；本片段只补充
# 不会重复声明 gzip / map / 正则 location 的预压缩回发开关。
#
# 生效方式：把本文件 include 到裸域 HTTPS 的 server {} 中，然后执行：
#   nginx -t && nginx -s reload
#
# deploy-server.sh 默认 PRECOMPRESS=1，会在每个新 release 生成同名 .gz。
# 缺少对应 .gz 时 nginx 仍回退到现有 gzip 实时压缩。
# Brotli 未在此启用；需要模块和单独的 .br 生成链路后再评估。

gzip_static on;
