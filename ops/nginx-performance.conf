# ops/nginx-performance.conf —— 站点性能相关的 nginx 配置片段（示例 / 清单，不自动加载）
#
# 重要：这份文件只是「可以直接抄进现有 server 块」的片段，本仓库的部署脚本
# （ops/deploy-server.sh / ops/rollback-server.sh）不会加载它，服务器上的 nginx
# 配置也仍在服务器侧维护。要生效必须由人工把它 include 进对应 server 块，或照抄
# 其中指令，然后 `nginx -t` 验证、reload。默认行为因此保持不变。
#
# 生效方式（示例）：
#   在服务器 <站点>.conf 的 server { ... } 里加：
#       include /path/to/bluedafeiyu/ops/nginx-performance.conf;
#   再跑：nginx -t && nginx -s reload
#
# 本文件里的指令都可用在 server 上下文（gzip / gzip_types / gzip_static / add_header 等）。
# brotli 需要额外的 nginx 模块，见文件末尾说明，默认给的是注释。
#
# 缓存策略一句话（详见下面「缓存策略」小节）：
#   - 只有带 `?v=<n>` 的 css/js 才用一年 immutable（改版即换 query）；
#   - 图片 7 天普通缓存（非 immutable，因为派生图文件名不是内容指纹）；
#   - HTML / JSON 一律 no-cache；xml / txt 短缓存（1 小时）。
# 特别注意：site-data.js 不带 `?v=`，绝不能长缓存（否则旧清单会滞留）。

# ---------------------------------------------------------------- 文本压缩
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    application/manifest+json;

# 预压缩静态文件：发布产物先用 `node tools/compress_static.mjs --dir <产物> --precompress`
# 生成 .gz，再打开这条，nginx 会直接回发 .gz，省掉实时压缩的 CPU。
# 注意顺序：预压缩必须在产物里生成 .gz 之后、`gzip_static` 打开之前完成；本仓库的
# ops/deploy-server.sh 也内置了这个开关——把环境变量 PRECOMPRESS 设为 1/true 时，
# 构建成功后会自动对 staging 产物跑一次 --precompress（默认关闭，避免产物无谓膨胀）。
# 没跑预压缩就不要打开（或缺 .gz 时 nginx 会回落到实时 gzip，行为安全）。
# gzip_static on;

# ---------------------------------------------------------------- 缓存策略
# 关键前提（决定了下面为什么不能无脑 immutable）：
#   - 本站只有 css/js 通过 `?v=<n>` 带版本号（tokens.css?v=14 / styles.css?v=18），
#     改版即换 query；除此之外都不带版本号；
#   - 派生图、site-data.js / site-data.json、analytics.js 的 URL 不含指纹，
#     换图 / 换数据靠重新发布覆盖「同名文件」；
#   - 所以：只有「带 ?v= 的 css/js」才可以 immutable 长缓存；图片只能给 7 天普通缓存
#     （到期回源校验，换图最长 7 天生效）；site-data.js/.json、HTML 一律 no-cache，
#     避免旧清单 / 旧页面滞留。
#
# 实现方式：css/js 用「变量 + if ($arg_v) + add_header $变量」判定，等价于在 http
# 上下文里写：
#     map $arg_v $asset_cache_control {
#         default  "public, max-age=31536000, immutable";   # 带 ?v=
#         ""       "no-cache";                              # 不带（含 site-data.js）
#     }
# 之所以不用 map：map 指令只能写在 http{}，而本文件其余指令都要 include 进 server{}；
# 用变量法可以让整份片段仍然「一次 include 进 server 块」。若你的 nginx 愿意在 http{}
# 里单独放 map，可把下面 css/js location 改成一行：
#     add_header Cache-Control $asset_cache_control always;

# 图片：派生图文件名固定、不是内容指纹，给 7 天普通缓存（非 immutable）。
# 不要 immutable：换图会覆盖同名文件，immutable 会让客户端在有效期内永不回源。
location ~* \.(?:webp|avif|png|jpe?g|gif|ico|bmp)$ {
    add_header Cache-Control "public, max-age=604800" always;
    access_log off;
}

# 版本化静态资源：css/js 带 `?v=<n>` 时才可长期缓存 + immutable（改版即换 query）。
# 不带 ?v= 的（如 site-data.js）退回 no-cache，每次回源校验，绝不长缓存。
location ~* \.(?:css|js|mjs)$ {
    set $asset_cache_control "no-cache";
    if ($arg_v) {
        set $asset_cache_control "public, max-age=31536000, immutable";
    }
    add_header Cache-Control $asset_cache_control always;
    access_log off;
}

# HTML / JSON：必须每次回源校验，避免改版后用户拿到旧页面或旧清单
# （site-data.json / submissions/works.json 都落在这里 → no-cache）。
location ~* \.(?:html?|json)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# robots.txt / sitemap.xml / 其它 xml 文本：短缓存，便于收录更新及时生效。
location ~* \.(?:xml|txt)$ {
    add_header Cache-Control "public, max-age=3600" always;
}

# ---------------------------------------------------------------- brotli（可选）
# 仅当服务器 nginx 编译了 ngx_brotli 模块时可用；没有模块就保持注释，不要打开，
# 否则 `nginx -t` 会因未知指令失败。http 上下文里需先有：
#     load_module modules/ngx_http_brotli_filter_module.so;
#     load_module modules/ngx_http_brotli_static_module.so;
# 然后 server / location 里可加：
#     brotli on;
#     brotli_comp_level 5;
#     brotli_min_length 1024;
#     brotli_types text/plain text/css application/javascript application/json
#                  application/xml image/svg+xml;
#     # 配合预压缩：产物里同时生成 .br 时启用（本仓库的 compress_static.mjs 只生成 .gz）
#     # brotli_static on;
#
# 若两个模块都启用，nginx 会在支持 brotli 的客户端优先回 .br，其余回 gzip 或明文。
