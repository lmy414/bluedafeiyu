# ops/nginx-performance.conf —— 站点性能与错误页的 nginx 配置片段
#
# 当前生产 vhost 已经维护 gzip、gzip_types 与缓存分层；本片段只补充
# 不会重复声明 gzip / map / 正则 location 的两件事：
#   1. 预压缩回发开关 gzip_static；
#   2. 自定义 404 页 error_page。
#
# 生效方式：把本文件 include 到裸域 HTTPS 的 server {} 中，然后执行：
#   nginx -t && nginx -s reload
#
# deploy-server.sh 默认 PRECOMPRESS=1，会在每个新 release 生成同名 .gz。
# 缺少对应 .gz 时 nginx 仍回退到现有 gzip 实时压缩。
# Brotli 未在此启用；需要模块和单独的 .br 生成链路后再评估。

gzip_static on;

# 自定义 404：页面是发布产物根上的 /404.html（站点源码 dist/404.html，
# tools/build.mjs 把它列为必需文件，缺了构建就会失败）。
#   · 刻意不写 `=200`：保持 404 状态码，搜索引擎照常当「没这个页面」处理；
#     页面自己带 <meta name="robots" content="noindex,follow">，
#     所以也没有额外往 robots.txt 里加 Disallow——挡了爬虫就看不到 noindex 了。
#   · 该页里的链接与静态资源一律站点根绝对路径，任何目录深度回发都能解析对。
#   · 这一句只影响「找不到就回哪个文件」，不影响任何正常请求的状态码。
error_page 404 /404.html;
