# Include in each public HTTPS server block, then run nginx -t and reload.
# The API consists only of generated files; this prefix never proxies to Node/CMS.
location ^~ /open-api/v1/ {
    default_type application/json;
    charset utf-8;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "ETag, Last-Modified" always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    if ($request_method = OPTIONS) { return 204; }
    # Keep missing API files out of the site's HTML error-page redirect.
    error_page 404 = @open_api_not_found;
    try_files $uri =404;
}

location @open_api_not_found {
    default_type application/json;
    charset utf-8;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "ETag, Last-Modified" always;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 404 '{"error":"Not found"}';
}
