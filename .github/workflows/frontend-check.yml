name: Frontend component and incremental checks
on:
  push:
    paths: ['frontend/**', 'tools/build_site.mjs', 'tools/og_cards.py', 'ops/deploy-server.sh', '.github/workflows/frontend-check.yml']
  pull_request:
    paths: ['frontend/**', 'tools/build_site.mjs', 'tools/og_cards.py', 'ops/deploy-server.sh', '.github/workflows/frontend-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend run check:components
      - run: npm --prefix frontend run test:incremental
